name: CI

# This repository had no CI at all until now — it was the only one of the six
# without a .github directory. That is why its CLI bugs survived: panda-php's
# `init` could not start and panda-go's `--kid` was accepted and discarded, and
# both were found by running the binaries, not by anything automated. Here the
# tests at least run somewhere other than the machine they were written on.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the floor declared in pyproject.toml; 3.12 is what most
        # people will be on. Testing both catches use of a stdlib feature that
        # only exists in the newer one.
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: pip install -e ".[dev]"

      - name: Declared versions agree
        run: python scripts/check_version.py

      - name: Test
        run: python -m pytest -q

      # The CLI is a surface the unit tests reach only through click's runner,
      # which does not exercise argument parsing the way the real binary does.
      # panda-php's `init` was unloadable while its whole test file passed.
      - name: The CLI starts
        run: |
          panda --version
          panda init --help
          panda init --help | grep -q -- --quick
          panda init --help | grep -q -- --kid
          panda init --help | grep -q -- --skip-key-gen
